[package]
name = "context-portal-rs"
version = "0.1.0"
edition = "2021"
description = "ConPort MCP Server - Rust rewrite"
authors = ["Nikola Hristov"]
license = "MIT"
autobenches = false
autobins = false
autoexamples = false
autotests = false
default-run = "ConportMcp"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
axum = "0.7"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
clap = { version = "4.4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
uuid = { version = "1.6", features = ["v4", "serde"] }

# ONNX Runtime for embeddings
ort = "2.0.0-rc.11"

# Tokenizers for text preprocessing
tokenizers = "0.15"

# USearch for vector similarity search
usearch = "0.10"

# C++ bindings for USearch
cxx = "1.0"

# Async runtime utilities
once_cell = "1.19"
parking_lot = "0.12"

# YAML serialization
serde_yaml = "0.9"

# Regex for text processing
regex = "1.12"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"

[lib]
name = "ConportLibrary"
path = "Source/Library.rs"

[[bin]]
name = "ConportMcp"
path = "Source/Binary.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1